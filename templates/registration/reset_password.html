{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block page_content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-success text-white text-center">

                <h2>
                    <i class="fas fa-key"></i>
                    Reset Password
                </h2>

                <p class="mb-0">
                    Create a new password
                </p>

            </div>

            <div class="card-body p-4">

                {% if messages %}
                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>

                    {% endfor %}
                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">

                            New Password

                        </label>

                        <input
                            type="password"
                            name="password1"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Confirm Password

                        </label>

                        <input
                            type="password"
                            name="password2"
                            class="form-control"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100 btn-lg"
                    >

                        <i class="fas fa-save"></i>

                        Save Password

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
