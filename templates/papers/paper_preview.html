{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/paper_preview.css' %}">
{% endblock %}

{% block content %}

<div class="container-fluid bg-light py-4">

    <!-- =========================
         Print Button
    ========================== -->
    <div class="no-print text-end mb-3">

        <a href="{% url 'papers:paper_print' pattern.id %}"
           target="_blank"
           class="btn btn-primary">

            🖨 Print Preview

        </a>
        <a href="{% url 'papers:paper_pdf' pattern.id %}"
   target="_blank"
   class="btn btn-success">

    📄 Download PDF

</a>

    </div>

    <!-- =========================
         Paper Preview
    ========================== -->

    <div class="paper-preview">

        {% include "papers/partials/paper_content.html" %}

    </div>

</div>



{% endblock %}
